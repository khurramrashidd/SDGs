<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ibtidaa Tech SDG app mark">
  <title>Ibtidaa Tech SDG — mark</title>
  <desc>An open ring with three ascending dots growing out of its gap: from beginning to impact.</desc>

  <!--
    ORIGINAL MARK - deliberately NOT the UN SDG colour wheel, which is an
    official United Nations emblem and not ours to redraw.

    Reading: the open ring is the shared goal. A seed leaves through the gap
    and grows as it rises - beginning, momentum, impact.

    Geometry is computed, not eyeballed: the composition bbox is centred in
    the 512 box with 34px padding. Do not nudge these numbers by hand.
  -->

  <defs>
    <linearGradient id="ibtRing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0E6E6E"/>
      <stop offset="1" stop-color="#14919B"/>
    </linearGradient>
  </defs>

  <g transform="translate(-19.68,-1.44) scale(1.0423)">
    <path d="M 236.06 204.09 A 120.0 120.0 0 1 0 320.91 288.94"
          fill="none" stroke="url(#ibtRing)" stroke-width="40.0"
          stroke-linecap="round"/>
    <circle cx="310" cy="185" r="17" fill="#14919B"/>
    <circle cx="366" cy="132" r="26" fill="#0E6E6E"/>
    <circle cx="428" cy="70" r="36" fill="#F2A93B"/>
  </g>
</svg>
