include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true

analyzer:
  errors:
    # Keep these loud - they are the ones that bite at runtime.
    unused_import: warning
    dead_code: warning
  exclude:
    # Generated and platform folders. Without these, `flutter analyze` reports
    # issues in code neither of us wrote, and the real problems get buried.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "android/**"
    - "ios/**"
    - "linux/**"
    - "macos/**"
    - "windows/**"
    - "web/**"
