<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaces the default Flutter web shell.
    Adds: real favicons, PWA metadata, and a branded loading screen so the
    first paint is not a blank white page while the engine downloads.
    `$FLUTTER_BASE_HREF` is substituted by `flutter build web`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description"
        content="Practical tools for the 17 UN Sustainable Development Goals — government schemes, scholarships, health and more. By Ibtidaa Tech.">

  <title>SDG App — Ibtidaa Tech</title>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E6E6E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SDG App">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F7F9F8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #101413; }
      #boot-name { color: #F0F5F4 !important; }
      /* Deep teal loses too much contrast on a near-black background. */
      #boot-ring path { stroke: #2FB3B3; }
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity .35s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }

    /* The app mark, drawn with the same geometry as brand/icon_badge.svg */
    #boot-mark {
      width: 84px;
      height: 84px;
      animation: rise .9s ease-out both;
    }
    /* Rotate about the ring's true centre (256,256 in user units), not the
       element bounding box - the gap makes those two differ and the mark
       would visibly wobble. */
    #boot-ring {
      transform-box: view-box;
      transform-origin: 256px 256px;
      animation: spin 1.5s cubic-bezier(.65,.05,.36,1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px) scale(.94); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-ring { animation: none; }
      #boot-mark { animation: none; }
    }

    #boot-name {
      font-size: 14px;
      letter-spacing: .09em;
      text-transform: uppercase;
      font-weight: 600;
      color: #14231F;
      opacity: .55;
    }
  </style>
</head>
<body>
  <div id="boot">
    <svg id="boot-mark" viewBox="0 0 512 512" aria-label="Loading">
      <g id="boot-ring">
        <path d="M 282.92 155.54 A 104 104 0 1 0 356.46 229.08"
              fill="none" stroke="#0E6E6E" stroke-width="50"
              stroke-linecap="round"/>
      </g>
      <circle cx="381.87" cy="130.13" r="46" fill="#F2A93B"/>
    </svg>
    <div id="boot-name">Ibtidaa Tech</div>
  </div>

  <script>
    // Hide the boot screen once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.classList.add('gone');
      setTimeout(function () { b.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
