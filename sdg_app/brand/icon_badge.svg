<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ibtidaa Tech SDG app icon">
  <title>Ibtidaa Tech SDG — app icon</title>
  <desc>White open ring with an amber dot on a deep teal rounded square.</desc>

  <!--
    APP ICON / FAVICON. The filled badge exists because the bare mark
    disappears on dark browser tabs and busy launcher wallpapers.
    Mark is kept inside 62% of the canvas so Android's circular mask and
    iOS's squircle do not clip it.
  -->

  <defs>
    <linearGradient id="ibtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14919B"/>
      <stop offset="1" stop-color="#0B5A5A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#ibtBg)"/>
  <g transform="translate(-9.22,-14.39) scale(1.0340)">
    <path d="M 258.92 185.54 A 104.0 104.0 0 1 0 332.46 259.08"
          fill="none" stroke="#FFFFFF" stroke-width="50.0" stroke-linecap="round"/>
    <circle cx="360.0" cy="158.0" r="50.0" fill="#F2A93B"/>
  </g>
</svg>
