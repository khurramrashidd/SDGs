<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ibtidaa Tech SDG icon">
  <title>Ibtidaa Tech SDG — small-size mark</title>
  <desc>Simplified version of the mark for favicons and small icons.</desc>

  <!--
    SMALL-SIZE VARIANT. Same idea as logo_mark.svg, but the three dots
    collapse into one and the ring is much heavier, because at 16-32px the
    detailed mark turns to mush. Use this anywhere under ~64px.
  -->

  <g transform="translate(-34.62,-42.71) scale(1.1556)">
    <path d="M 243.65 174.43 A 130.0 130.0 0 1 0 335.57 266.35"
          fill="none" stroke="#0E6E6E" stroke-width="62.0"
          stroke-linecap="round"/>
    <circle cx="392" cy="118" r="62" fill="#F2A93B"/>
  </g>
</svg>
