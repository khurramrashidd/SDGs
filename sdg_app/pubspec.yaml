name: sdg_app
description: Ibtidaa Tech SDG App - solutions for the 17 UN Sustainable Development Goals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # Auth
  google_sign_in: ^6.2.1

  # State + routing
  provider: ^6.1.2
  go_router: ^14.3.0

  # Storage + utils
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  http: ^1.2.2

  # Medicine reminders (SDG 3). Held at 19.x on purpose: 20.0 needs Flutter
  # 3.32 and changes every call to named parameters, 21.0 needs Flutter
  # 3.38. Needs two one-time edits under android/ - see LOCAL_CHANGES.md #7.
  flutter_local_notifications: ^19.4.0
  timezone: '>=0.10.0 <0.11.0'

  # NOTE: `intl` is tied to the Flutter SDK, because flutter_localizations
  # pins an exact range of it. If `flutter pub get` ever fails with
  # "flutter_localizations from sdk ... depends on intl ^x.y.z", set the
  # version below to the one in that message. Nothing in this app's code
  # changes - only DateFormat is used, which is stable across these versions.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Range rather than a caret pin, so a newer Flutter SDK does not get
  # silently downgraded to an old lint set.
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/data/
